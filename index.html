<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#F7F5F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日记">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>日记</title>
<style>
:root{
  --bg:#F7F5F1; --card:#FFFFFF; --ink:#23211E; --sub:#8A857D; --line:#E7E3DB;
  --accent:#3E6650; --accent-soft:#EAF0EB; --warn:#A85B3C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  font-size:16px; line-height:1.75; -webkit-font-smoothing:antialiased;
}
.app{display:flex; flex-direction:column; height:100dvh; max-width:640px; margin:0 auto}
main{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 18px 24px}
.view{display:none}
.view.on{display:block}
.top{display:flex; align-items:baseline; justify-content:space-between; padding:22px 0 14px}
.d{font-size:19px; font-weight:600; letter-spacing:.2px}
.w{font-size:13px; color:var(--sub); margin-left:8px; font-weight:400}
.back{border:0; background:none; color:var(--accent); font-size:15px; padding:0; margin:0; font-family:inherit}
textarea{width:100%; min-height:44vh; border:0; background:transparent; font-family:inherit;
  font-size:16.5px; line-height:1.85; color:var(--ink); resize:none; outline:none; padding:6px 0}
textarea::placeholder{color:#BDB7AC}
.btn{width:100%; border:0; border-radius:12px; padding:15px; font-family:inherit;
  font-size:16px; font-weight:500; background:var(--accent); color:#fff; margin-top:14px}
.btn:active{opacity:.82}
.btn.ghost{background:var(--card); color:var(--ink); border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.row2{display:flex; gap:10px; margin-top:12px}
.row2 .btn{margin-top:0; flex:1}
.mini{border:1px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:9px; padding:7px 13px; font-size:13.5px; font-family:inherit}
.mini:active{background:var(--accent-soft)}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin:14px 0}
.card h3{margin:0 0 10px; font-size:13px; font-weight:600; color:var(--sub);
  letter-spacing:.06em; display:flex; align-items:center; justify-content:space-between}
.body{white-space:pre-wrap; word-break:break-word; font-size:15.5px}
.body.muted{color:var(--sub)}
.item{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px}
.item:active{background:#FCFBF8}
.item .h{display:flex; align-items:baseline}
.item .dt{font-size:15px; font-weight:600}
.item .tags{font-size:12px; color:var(--accent); margin-left:auto}
.item .pv{color:var(--sub); font-size:14px; margin-top:6px; display:-webkit-box;
  -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.empty{color:var(--sub); text-align:center; padding:60px 20px; font-size:14.5px; line-height:2}
label.lb{display:block; font-size:13px; color:var(--sub); margin:18px 0 6px}
input,select{width:100%; border:1px solid var(--line); border-radius:10px; padding:12px 13px;
  font-family:inherit; font-size:15px; background:var(--card); color:var(--ink); outline:none}
input:focus,select:focus{border-color:var(--accent)}
.hint{font-size:12.5px; color:var(--sub); line-height:1.8; margin:8px 0 0}
nav{display:flex; border-top:1px solid var(--line); background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px); padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1; border:0; background:none; font-family:inherit; padding:11px 0 13px;
  font-size:12px; color:var(--sub); display:flex; flex-direction:column; align-items:center; gap:3px}
nav button i{font-style:normal; font-size:19px; line-height:1}
nav button.on{color:var(--accent)}
#toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
  background:rgba(35,33,30,.9); color:#fff; font-size:14px; padding:10px 18px;
  border-radius:20px; opacity:0; pointer-events:none; transition:opacity .22s; z-index:99;
  max-width:82vw; text-align:center}
#toast.on{opacity:1}
.status{font-size:12.5px; color:var(--warn); padding:8px 0 0; line-height:1.7}
.seg{display:flex; gap:8px; margin:6px 0 2px}
.seg button{flex:1; border:1px solid var(--line); background:var(--card); color:var(--sub);
  border-radius:9px; padding:9px 0; font-size:13.5px; font-family:inherit}
.seg button.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:500}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:14px 0}
.stat{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:13px 8px; text-align:center}
.stat b{display:block; font-size:21px; font-weight:600; letter-spacing:.3px; line-height:1.3}
.stat span{font-size:11.5px; color:var(--sub)}
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{background:var(--accent-soft); color:var(--accent); border-radius:20px; padding:4px 11px; font-size:13px}
.chip i{font-style:normal; opacity:.55; font-size:11.5px; margin-left:4px}
.same{font-size:14px; color:var(--sub); line-height:1.75}
.same b{color:var(--ink); font-weight:600; font-size:13px; display:block; margin-bottom:3px}
.same+.same{margin-top:12px; padding-top:12px; border-top:1px solid var(--line)}
.spin{display:inline-block; animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <main>

    <section class="view on" id="v-write">
      <div class="top">
        <div><span class="d" id="d-today">今天</span><span class="w" id="w-today"></span></div>
        <span class="w" id="saved-tip"></span>
      </div>
      <textarea id="raw" placeholder="今天……"></textarea>
      <button class="btn" id="btn-save">保存</button>
      <div class="hint">想到什么写什么，不用整理，错别字也不用改。写完保存，可以去下面「日记本」里让她整理。</div>
    </section>

    <section class="view" id="v-note">
      <div class="top">
        <button class="back" id="btn-back">‹ 日记本</button>
        <span class="w" id="note-date"></span>
      </div>
      <div class="card">
        <h3>日记原文<button class="mini" id="btn-edit">编辑</button></h3>
        <div class="body" id="note-raw"></div>
      </div>
      <div class="row2">
        <button class="btn ghost" id="btn-tidy">整理</button>
        <button class="btn ghost" id="btn-sum">总结</button>
        <button class="btn ghost" id="btn-insight">看看我</button>
      </div>
      <div class="hint" id="note-hint">整理＝把你写的理顺分段，不改你的话；总结＝五条；看看我＝像心理咨询师那样给你一段分析。</div>
      <div class="status" id="note-status"></div>
      <div class="card" id="c-tidy" style="display:none">
        <h3>整理后的日记<button class="mini" id="btn-copy-tidy">复制</button></h3>
        <div class="body" id="b-tidy"></div>
      </div>
      <div class="card" id="c-sum" style="display:none">
        <h3>今天<button class="mini" id="btn-copy-sum">复制</button></h3>
        <div class="body" id="b-sum"></div>
      </div>
      <div class="card" id="c-insight" style="display:none">
        <h3>说给你听<button class="mini" id="btn-copy-insight">复制</button></h3>
        <div class="body" id="b-insight"></div>
      </div>
      <div class="row2" style="margin-top:18px">
        <button class="mini" id="btn-copymd" style="flex:1">复制 Markdown</button>
        <button class="mini" id="btn-copyprompt" style="flex:1">复制提示词</button>
      </div>
      <div class="row2">
        <button class="mini" id="btn-del" style="flex:1;color:#A85B3C">删除这篇</button>
      </div>
    </section>

    <section class="view" id="v-list">
      <div class="top"><div><span class="d">日记本</span><span class="w" id="count"></span></div></div>
      <div id="list"></div>
    </section>

    <section class="view" id="v-review">
      <div class="top"><div><span class="d">回顾</span><span class="w" id="rv-sub"></span></div></div>

      <div class="seg" id="rv-seg">
        <button data-r="7" class="on">近 7 天</button>
        <button data-r="30">近 30 天</button>
        <button data-r="all">全部</button>
      </div>

      <div class="stats" id="rv-stats"></div>

      <div class="card" id="rv-words-card" style="display:none">
        <h3>反复出现的词</h3>
        <div class="chips" id="rv-words"></div>
      </div>

      <div class="card" id="rv-same-card" style="display:none">
        <h3>往期今天</h3>
        <div id="rv-same"></div>
      </div>

      <button class="btn" id="btn-review">让 AI 读一遍</button>
      <div class="status" id="rv-status"></div>

      <div class="card" id="rv-ai-card" style="display:none">
        <h3>读完之后<button class="mini" id="btn-copy-review">复制</button></h3>
        <div class="body" id="rv-ai"></div>
      </div>

      <div class="row2">
        <button class="mini" id="btn-rv-prompt" style="flex:1">复制提示词（不填接口也能用）</button>
      </div>
      <div class="hint">
        回顾不是数数，是把这几天的日记放在一起看线：主线在哪、什么在反复、有没有变。
      </div>
    </section>

    <section class="view" id="v-set">
      <div class="top"><div><span class="d">设置</span></div></div>

      <label class="lb">AI 接口（整理、总结、说给你听、回顾要用）</label>
      <p class="hint" style="margin:0 0 12px">
        前四个都有免费额度，随便挑一个。不填也能记日记，只是得自己动手整理。<br>
        密钥只存在这台手机里，不上传，也不在代码里。
      </p>
      <select id="preset">
        <option value="">选一个服务商……</option>
        <option value="modelscope">魔搭 ModelScope（免费，每天有额度）</option>
        <option value="siliconflow_free">硅基流动 · 免费模型</option>
        <option value="hunyuan">腾讯混元 · lite（免费）</option>
        <option value="dashscope">阿里百炼 · 通义（新用户免费额度）</option>
        <option value="openrouter_free">OpenRouter · 免费模型</option>
        <option value="deepseek">DeepSeek（便宜，几块钱用很久）</option>
        <option value="moonshot">Moonshot / Kimi</option>
        <option value="ark">火山方舟 · 豆包（要填接入点 ID）</option>
        <option value="zhipu">智谱 GLM（网页连不上，别选）</option>
        <option value="custom">自定义</option>
      </select>
      <p class="hint" id="presetHint" style="display:none"></p>

      <label class="lb">接口地址</label>
      <input id="base" placeholder="https://api.siliconflow.cn/v1" autocapitalize="off" autocorrect="off">

      <label class="lb">模型名</label>
      <input id="model" placeholder="Qwen/Qwen2.5-7B-Instruct" autocapitalize="off" autocorrect="off">

      <label class="lb">API Key</label>
      <input id="key" type="password" placeholder="sk-..." autocapitalize="off" autocorrect="off">

      <button class="btn ghost" id="btn-test">测试连接</button>
      <button class="btn" id="btn-savecfg">保存设置</button>
      <p class="hint" id="testHint"></p>

      <label class="lb" style="margin-top:34px">我的写作习惯（会一起发给 AI）</label>
      <p class="hint" style="margin:0 0 8px">写几行你平时说话的样子，整理出来才像你。</p>
      <textarea id="voice" style="min-height:110px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card);font-size:15px"></textarea>

      <label class="lb" style="margin-top:30px">数据</label>
      <div class="row2">
        <button class="mini" id="btn-export" style="flex:1">导出备份</button>
        <button class="mini" id="btn-import" style="flex:1">导入备份</button>
      </div>
      <input type="file" id="file" accept=".json" style="display:none">
      <p class="hint" style="margin-top:12px">
        日记只存在这台手机上。换手机或清缓存前记得导出一次。
      </p>
    </section>

  </main>

  <nav>
    <button data-v="write" class="on"><i>✎</i>写日记</button>
    <button data-v="list"><i>▤</i>日记本</button>
    <button data-v="review"><i>◎</i>回顾</button>
    <button data-v="set"><i>⚙</i>设置</button>
  </nav>
</div>
<div id="toast"></div>
<script>
var KEY='diary.v1';
var store={entries:[],cfg:{base:'',model:'',key:''},voice:'',reviews:{}};
var cur=null;

function $(id){return document.getElementById(id);}
function toast(t){var e=$('toast');e.textContent=t;e.className='on';clearTimeout(e._t);e._t=setTimeout(function(){e.className='';},2200);}
function pad(n){return n<10?'0'+n:''+n;}
function todayId(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmt(id){
  var d=new Date(id+'T00:00:00');
  var wk=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+wk;
}
function load(){
  try{var s=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(s.entries)store.entries=s.entries;
    if(s.cfg)store.cfg=s.cfg;
    if(s.voice)store.voice=s.voice;
    if(s.reviews)store.reviews=s.reviews;
  }catch(e){}
}
function persist(){localStorage.setItem(KEY,JSON.stringify(store));}
function find(id){for(var i=0;i<store.entries.length;i++){if(store.entries[i].id===id)return store.entries[i];}return null;}

/* ---------- 视图切换 ---------- */
function show(v){
  var vs=document.querySelectorAll('.view');
  for(var i=0;i<vs.length;i++)vs[i].className='view';
  $('v-'+v).className='view on';
  var bs=document.querySelectorAll('nav button');
  for(var j=0;j<bs.length;j++){
    bs[j].className=(bs[j].getAttribute('data-v')===v)?'on':'';
  }
  document.querySelector('main').scrollTop=0;
}
document.querySelectorAll('nav button').forEach(function(b){
  b.onclick=function(){
    var v=b.getAttribute('data-v');
    if(v==='list')renderList();
    if(v==='write')loadToday();
    if(v==='review')renderReview();
    show(v);
  };
});

/* ---------- 写 ---------- */
function loadToday(){
  var id=todayId();
  $('d-today').textContent=fmt(id).replace(' ','·');
  $('w-today').textContent='';
  var e=find(id);
  $('raw').value=e?e.raw:'';
  $('saved-tip').textContent=e?'已保存':'';
  autoGrow();
}
function autoGrow(){
  var t=$('raw');t.style.height='auto';
  t.style.height=Math.max(t.scrollHeight,window.innerHeight*0.44)+'px';
}
$('raw').addEventListener('input',autoGrow);

$('btn-save').onclick=function(){
  var txt=$('raw').value.trim();
  if(!txt){toast('还没写呢');return;}
  var id=todayId(),e=find(id);
  if(e){e.raw=txt;e.upd=Date.now();}
  else{store.entries.push({id:id,raw:txt,tidy:'',sum:'',insight:'',upd:Date.now()});}
  persist();
  $('saved-tip').textContent='已保存';
  toast('存好了');
};

/* ---------- 日记本 ---------- */
function renderList(){
  var box=$('list'),list=store.entries.slice().sort(function(a,b){return a.id<b.id?1:-1;});
  $('count').textContent=list.length?list.length+' 篇':'';
  if(!list.length){box.innerHTML='<div class="empty">还没有日记。<br>去「写日记」写第一篇。</div>';return;}
  box.innerHTML='';
  list.forEach(function(e){
    var d=document.createElement('div');d.className='item';
    var tags=[];
    if(e.tidy)tags.push('整理');
    if(e.sum)tags.push('总结');
    if(e.insight)tags.push('洞察');
    var h=document.createElement('div');h.className='h';
    var dt=document.createElement('span');dt.className='dt';dt.textContent=fmt(e.id);
    h.appendChild(dt);
    if(tags.length){var tg=document.createElement('span');tg.className='tags';tg.textContent=tags.join(' · ');h.appendChild(tg);}
    var pv=document.createElement('div');pv.className='pv';pv.textContent=e.raw.slice(0,90);
    d.appendChild(h);d.appendChild(pv);
    d.onclick=function(){openNote(e.id);};
    box.appendChild(d);
  });
}

/* ---------- 单篇 ---------- */
function openNote(id){
  cur=find(id);
  if(!cur)return;
  $('note-date').textContent=fmt(id);
  $('note-raw').textContent=cur.raw;
  paint('tidy');paint('sum');paint('insight');
  $('note-status').textContent='';
  show('note');
}
function paint(k){
  var map={tidy:['c-tidy','b-tidy'],sum:['c-sum','b-sum'],insight:['c-insight','b-insight']};
  var m=map[k];
  if(cur[k]){$(m[0]).style.display='';$(m[1]).textContent=cur[k];$(m[1]).className='body';}
  else{$(m[0]).style.display='none';}
}
$('btn-back').onclick=function(){renderList();show('list');};
$('btn-edit').onclick=function(){
  $('raw').value=cur.raw;show('write');autoGrow();toast('改完点保存');
};
$('btn-del').onclick=function(){
  if(!confirm('删掉这一篇？删了就找不回来了。'))return;
  store.entries=store.entries.filter(function(e){return e.id!==cur.id;});
  persist();cur=null;renderList();show('list');toast('删了');
};

/* ---------- AI ---------- */
function voiceLine(){
  var v=(store.voice||'').trim();
  return v?('\n\n她的说话习惯（整理时要贴着这个来）：\n'+v):'';
}
var P_TIDY=[
'你在帮一个人整理她的日记。下面是她的原话。',
'',
'规则：',
'- 只做整理：理顺语句、分段、补标点，删掉重复的口头语。',
'- 保留所有具体细节：时间、数字、人名、地名、她原话里的语气词。',
'- 不改她的判断，不替她下结论，不升华，不加金句。',
'- 保持第一人称，保持她原来的语序，不要改写成书面语。',
'- 长度不要比原文长。',
'- 不要出现这些词：首先、其次、总之、值得注意的是、不仅、而且、而是。',
'',
'直接输出整理后的正文。不要标题，不要解释，不要用代码块包起来。',
'',
'原文：'
].join('\n');
var P_SUM=[
'把下面这篇日记总结成五条。',
'',
'① 发生了什么／心情和状态',
'② 灵感与想法要点',
'③ 有什么积极的愿望',
'④ 要感谢的事',
'⑤ 未完成待办',
'',
'要求：',
'- 每条用短句，一到三行，不要写成长段落。',
'- 只用日记里真实有的内容。某一条确实没有，就写「无」，不要编。',
'- 待办要具体到能照着做，比如「问儿子喜欢什么歌」，而不是「多关心孩子」。',
'- 不用套话，不加总结句，结尾不要鼓励语。',
'',
'严格按这个格式输出，一条一行，用 ①②③④⑤ 开头：',
'',
'日记：'
].join('\n');
var P_INS=[
'你是她的心理顾问，也是她信任的长辈。说话直接，不哄人，也不说教。',
'',
'基于下面这篇日记，写一段分析。',
'',
'要求：',
'- 先说你在她这段话里看到的一个具体的模式或矛盾，指出来，不要泛泛地说「你很努力」「你很独立」。',
'- 可以温和地指出她在回避什么、在替谁承担、在害怕什么。',
'- 给一到两个今天或这周就能做的小建议，要具体。',
'- 最后说一句你能真心说出口的话，不要励志口号。',
'- 三百到五百字，短句，分段，不用小标题，不用 emoji。',
'- 不下诊断，不用心理学术语装门面。',
'- 不要用「以下是分析」开头，直接写。',
'',
'日记：'
].join('\n');

async function chat(userText){
  var c=store.cfg;
  if(!c.base||!c.key||!c.model)throw new Error('NOKEY');
  var url=c.base.replace(/\/+$/,'')+'/chat/completions';
  var r;
  try{
    r=await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key},
      body:JSON.stringify({model:c.model,temperature:0.8,max_tokens:1600,
        messages:[{role:'system',content:'你是中文助手。输出直接、干净，不寒暄，不用套话。'},{role:'user',content:userText}]})
    });
  }catch(e){
    throw new Error('FETCH:网络没通，或者这个接口不允许网页直接调用');
  }
  var t=await r.text();
  if(!r.ok){
    var m='';
    try{var j=JSON.parse(t);m=(j.error&&(j.error.message||j.error.code))||j.message||t;}catch(e){m=t;}
    throw new Error('HTTP'+r.status+':'+String(m).slice(0,200));
  }
  var d;
  try{d=JSON.parse(t);}catch(e){throw new Error('PARSE:返回的东西不是 JSON');}
  var out=d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;
  if(!out)throw new Error('EMPTY:返回空内容');
  return out.trim();
}
function explain(e){
  var s=String(e.message||e);
  if(s.indexOf('NOKEY')>-1)return '先去「设置」填一个 AI 接口。或者点下面的「复制提示词」，把它发给我，我来写。';
  if(s.indexOf('FETCH')>-1)return '连不上这个接口（跨域被拦或网络不通）。换个服务商试试，或者用「复制提示词」。';
  if(s.indexOf('HTTP401')>-1)return 'Key 不对或已失效。回设置里重新复制一遍。';
  if(s.indexOf('HTTP402')>-1)return '服务商提示没余额。免费模型也可能被拦——硅基流动要实名认证后充 0.01 元才解锁，或者换 OpenRouter 免费模型。';
  if(s.indexOf('HTTP429')>-1)return '请求太频繁，是免费档的限速。等十几秒再点一次。';
  if(s.indexOf('HTTP404')>-1)return '接口地址或模型名不对。检查设置里的地址（要带 /v1）和模型名。';
  return s;
}
function busy(on,txt){
  document.querySelectorAll('#v-note .btn').forEach(function(b){b.disabled=on;});
  $('note-status').textContent=on?txt:'';
}
function recentContext(id){
  var list=store.entries.filter(function(e){return e.id<id;}).sort(function(a,b){return a.id<b.id?1:-1;}).slice(0,2);
  if(!list.length)return '';
  return '\n\n她前几天的日记（供参考，不要复述）：\n'+list.map(function(e){
    return '【'+e.id+'】'+e.raw.slice(0,400);
  }).join('\n\n');
}
async function run(kind){
  if(!cur)return;
  var prompt,txt,label;
  if(kind==='tidy'){prompt=P_TIDY+cur.raw+voiceLine();label='正在整理…';}
  else if(kind==='sum'){prompt=P_SUM+cur.raw;label='正在总结…';}
  else{prompt=P_INS+cur.raw+recentContext(cur.id);label='正在读你…';}
  busy(true,label);
  try{
    txt=await chat(prompt);
    cur[kind]=txt;cur.upd=Date.now();persist();paint(kind);
    $('note-status').textContent='';
  }catch(e){
    $('note-status').textContent=explain(e);
  }finally{busy(false);}
}
$('btn-tidy').onclick=function(){run('tidy');};
$('btn-sum').onclick=function(){run('sum');};
$('btn-insight').onclick=function(){run('insight');};

/* ---------- 复制 ---------- */
function copyStr(s){
  if(navigator.clipboard&&window.isSecureContext){
    return navigator.clipboard.writeText(s);
  }
  return new Promise(function(res,rej){
    var ta=document.createElement('textarea');ta.value=s;
    ta.style.position='fixed';ta.style.left='-9999px';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');res();}catch(e){rej(e);}
    document.body.removeChild(ta);
  });
}
function cp(id,key){
  if(!cur||!cur[key]){toast('还没有内容');return;}
  copyStr(cur[key]).then(function(){toast('已复制');},function(){toast('复制失败');});
}

/* ---------- 回顾 ---------- */
var rvRange='7';
var EMO=['开心','高兴','踏实','轻松','平静','成就感','感谢','期待','满足','累','烦','慌','焦虑','难过','委屈','生气','紧张','孤独','失望'];
var TOPIC=['老公','儿子','孩子','妈妈','伯母','朋友','同事','客户','公司','图书馆','医院','学校','万达','开会','工作','方案','工具','手机','日记','照片','吃饭','睡觉','散步','看书','运动','短剧','小红书','抖音','写作','房贷','加班'];

function dayShift(id,days){
  var d=new Date(id+'T00:00:00');d.setDate(d.getDate()+days);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function sortedDesc(){return store.entries.slice().sort(function(a,b){return a.id<b.id?1:-1;});}
function inRange(n){
  var all=sortedDesc();
  if(n==='all')return all;
  var from=dayShift(todayId(),-(parseInt(n,10)-1));
  return all.filter(function(e){return e.id>=from;});
}
function streakDays(){
  var ids={};store.entries.forEach(function(e){ids[e.id]=1;});
  var cur=todayId(),n=0;
  if(!ids[cur])cur=dayShift(cur,-1);
  while(ids[cur]&&n<4000){n++;cur=dayShift(cur,-1);}
  return n;
}
function rvSig(list){
  return list.map(function(e){return e.id+':'+(e.upd||0);}).join(',');
}
function wordCounts(list){
  var txt=list.map(function(e){return (e.tidy||'')+'\n'+e.raw;}).join('\n').toLowerCase();
  var out=[];
  EMO.concat(TOPIC).forEach(function(w){
    var c=txt.split(w.toLowerCase()).length-1;
    if(c>0)out.push({w:w,c:c});
  });
  out.sort(function(a,b){return b.c-a.c||b.w.length-a.w.length;});
  return out;
}

function renderReview(){
  var segs=document.querySelectorAll('#rv-seg button');
  for(var i=0;i<segs.length;i++){
    segs[i].className=(segs[i].getAttribute('data-r')===rvRange)?'on':'';
  }
  var list=inRange(rvRange);
  var st=$('rv-stats');

  if(!list.length){
    st.innerHTML='<div class="empty" style="grid-column:1/-1;padding:30px 6px">这段时间还没有日记。</div>';
    $('rv-sub').textContent='';
  }else{
    var chars=0;
    list.forEach(function(e){chars+=e.raw.length;});
    st.innerHTML=
      '<div class="stat"><b>'+list.length+'</b><span>篇</span></div>'+
      '<div class="stat"><b>'+streakDays()+'</b><span>连续记录 · 天</span></div>'+
      '<div class="stat"><b>'+Math.round(chars/list.length)+'</b><span>平均字数</span></div>';
    $('rv-sub').textContent=(rvRange==='all'?'全部':rvRange+' 天')+' · '+chars+' 字';
  }

  /* 反复出现的词 */
  var ws=wordCounts(list).filter(function(x){return x.c>=2;}).slice(0,12);
  $('rv-words-card').style.display=(list.length&&ws.length)?'':'none';
  $('rv-words').innerHTML='';
  ws.forEach(function(x){
    var s=document.createElement('span');s.className='chip';
    s.textContent=x.w;
    var i2=document.createElement('i');i2.textContent=x.c;s.appendChild(i2);
    $('rv-words').appendChild(s);
  });

  /* 往期今天 */
  var box=$('rv-same');
  box.innerHTML='';
  var hit=0;
  [['一周前',7],['一个月前',30],['半年前',180],['一年前',365]].forEach(function(p){
    var e=find(dayShift(todayId(),-p[1]));
    if(!e)return;
    hit++;
    var d=document.createElement('div');d.className='same';
    var b=document.createElement('b');b.textContent=p[0]+'　'+e.id;
    d.appendChild(b);
    d.appendChild(document.createTextNode(e.raw.slice(0,66)+(e.raw.length>66?'…':'')));
    d.onclick=function(){openNote(e.id);};
    box.appendChild(d);
  });
  $('rv-same-card').style.display=hit?'':'none';

  /* 已有的分析 */
  var rec=store.reviews[rvRange];
  if(rec&&rec.text){
    $('rv-ai-card').style.display='';
    $('rv-ai').textContent=rec.text;
    $('rv-status').textContent=(rec.sig===rvSig(list))?'':'日记有更新，可以再读一遍。';
  }else{
    $('rv-ai-card').style.display='none';
    $('rv-status').textContent='';
  }
}
document.querySelectorAll('#rv-seg button').forEach(function(b){
  b.onclick=function(){
    rvRange=b.getAttribute('data-r');
    $('rv-status').textContent='';
    renderReview();
  };
});

function rvBody(list){
  return list.slice().reverse().map(function(e){
    return '【'+e.id+'】\n'+(e.tidy||e.raw);

}
function rvInstruction(){
  return '把这些日记放在一起看。不是逐篇复述，是看这段时间的线。\n\n'
    +'严格按四段输出，用 ①②③④ 开头，不要小标题，不要开场白：\n'
    +'① 这段时间的主线：心思主要落在哪。两三句，必须带上具体的事。\n'
    +'② 反复出现的：同一件事或同一种情绪反反复复的，点名说清出现了几次、在哪几篇。\n'
    +'③ 变化：跟更早的时候比，什么变了（语气、在意的事、对自己的判断）。看不出就如实写「看不出明显变化」。\n'
    +'④ 一句真话：像她信任的长辈那样说一句，可以不好听，但要真。不要励志口号。\n\n'
    +'规则：只依据给出的日记，不脑补；引用原话用「」短引；不写「继续保持」「相信你」这类话；三百到五百字。\n\n';
}

$('btn-review').onclick=async function(){
  var list=inRange(rvRange);

$('btn-export').onclick=function(){
  var blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});

  a.href=URL.createObjectURL(blob);

$('btn-import').onclick=function(){$('file').click();};
function doImport(obj){
  if(!obj||!obj.entries||!obj.entries.length)throw new Error('bad');
  var n=0;
  obj.entries.forEach(function(e){
    if(!e.id)return;
    var old=find(e.id);
    if(old){for(var k in e){old[k]=e[k];}}
    else{store.entries.push(e);}
    n++;
  });
  if(obj.voice&&!store.voice)store.voice=obj.voice;
  persist();
  return n;
}
$('file').onchange=function(){
  var f=this.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{var n=doImport(JSON.parse(rd.result));renderList();toast('导入了 '+n+' 篇');}
    catch(e){toast('导入失败：文件不对');}
  };
  rd.readAsText(f);
};

/* 链接导入：…/#pull=2026-11-02  或  …/#import=<base64> */
function importFromHash(){
  var hsh=location.hash||'';
  var p=hsh.match(/pull=([A-Za-z0-9_-]+)/);
  if(p){
    show('list');
    fetch('imports/'+p[1]+'.json',{cache:'no-store'}).then(function(r){
      if(!r.ok)throw new Error('404');
      return r.json();
    }).then(function(o){
      var n=doImport(o);
      history.replaceState(null,'',location.pathname);
      renderList();
      setTimeout(function(){toast('已导入 '+n+' 篇');},300);
    }).catch(function(){
      history.replaceState(null,'',location.pathname);
      renderList();
      toast('没找到要导入的内容，可能要等一会儿');
    });
    return true;
  }
  var m=hsh.match(/import=([^&]+)/);
  if(!m)return false;
  try{
    var b=decodeURIComponent(m[1]).replace(/-/g,'+').replace(/_/g,'/');
    while(b.length%4)b+='=';
    var s=decodeURIComponent(escape(atob(b)));
    var n=doImport(JSON.parse(s));
    history.replaceState(null,'',location.pathname);
    renderList();show('list');
    setTimeout(function(){toast('已导入 '+n+' 篇');},300);
    return true;
  }catch(e){
    history.replaceState(null,'',location.pathname);
    toast('链接里的内容读不出来');
    return false;
  }
}
