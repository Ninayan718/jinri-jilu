<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今日记录">
<meta name="theme-color" content="#1F1E1C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png">
<title>今日记录</title>
<style>
:root{
  --bg:#F6F5F2; --card:#FFFFFF; --line:#E4E1DB;
  --tx:#1F1E1C; --tx2:#6E6B65; --tx3:#9C9890; --sel:#1F1E1C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0; background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  font-size:16px; line-height:1.6;
  padding:0 0 calc(40px + env(safe-area-inset-bottom)) 0;
}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{padding:calc(22px + env(safe-area-inset-top)) 0 14px}
h1{font-size:20px;font-weight:600;margin:0 0 2px}
.sub{font-size:13px;color:var(--tx3);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
label.lb{display:block;font-size:13px;color:var(--tx2);margin:0 0 8px;font-weight:500}
input[type=date],textarea{
  width:100%;font:inherit;color:var(--tx);background:#FCFCFB;
  border:1px solid var(--line);border-radius:10px;padding:12px;outline:none;
}
input[type=date]{font-size:16px}
textarea{min-height:52vh;resize:vertical;line-height:1.75;background:#FCFCFB}
textarea:focus,input:focus{border-color:#C9C5BD;background:#fff}
.hint{font-size:12px;color:var(--tx3);margin:8px 0 0}
button.act{
  width:100%;border:none;border-radius:12px;padding:16px;font-size:16px;font-weight:600;
  background:var(--sel);color:#fff;cursor:pointer;
}
button.act:active{opacity:.82}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(28px + env(safe-area-inset-bottom));
  background:var(--sel);color:#fff;padding:12px 18px;border-radius:12px;
  font-size:14px;opacity:0;pointer-events:none;transition:opacity .22s;z-index:9;
  max-width:88vw;text-align:center;
}
.toast.show{opacity:1}
.day{border-top:1px solid var(--line);padding:12px 0}
.day:first-child{border-top:none}
.day .d{font-size:13px;color:var(--tx2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.day .p{margin:6px 0 0;font-size:14px;color:var(--tx);white-space:pre-wrap;word-break:break-word}
.mini{border:1px solid var(--line);background:#fff;color:var(--tx);border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer}
.mini.del{color:#A32D2D;border-color:#F0D5D5}
.empty{font-size:14px;color:var(--tx3);text-align:center;padding:18px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>今日记录</h1>
    <p class="sub">想到啥写啥，写完点复制，去微信粘贴发给我</p>
  </header>

  <div class="card">
    <label class="lb" for="date">日期</label>
    <input type="date" id="date">
  </div>

  <div class="card">
    <label class="lb" for="body">今天做了啥</label>
    <textarea id="body" placeholder="上午跟王总开会，方案被否了&#10;下午重写，改到第三版才过&#10;烦死了&#10;&#10;不用整理，不用打标点，错别字也留着"></textarea>
    <p class="hint">手机上直接用输入法的麦克风说就行，说完不用改。</p>
  </div>

  <button class="act" id="copy">复制，发给 WorkBuddy</button>

  <div class="card" style="margin-top:16px">
    <label class="lb">本机存过的</label>
    <div id="list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var KEY = 'wxlog.v2';
var store = JSON.parse(localStorage.getItem(KEY) || '{}');
if (!store.days) store.days = {};
function save(){ localStorage.setItem(KEY, JSON.stringify(store)); }

function todayStr(){
  var d = new Date(), m = d.getMonth() + 1, dd = d.getDate();
  return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (dd < 10 ? '0' + dd : dd);
}

var dateEl = document.getElementById('date');
var bodyEl = document.getElementById('body');

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

function copyStr(s){
  if (navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(s);
  }
  return new Promise(function(res, rej){
    var ta = document.createElement('textarea');
    ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    ok ? res() : rej();
  });
}

function renderList(){
  var host = document.getElementById('list');
  host.innerHTML = '';
  var ds = Object.keys(store.days).sort().reverse();
  if (!ds.length){ host.innerHTML = '<div class="empty">还没存过</div>'; return; }
  ds.slice(0, 20).forEach(function(d){
    var txt = store.days[d] || '';
    var el = document.createElement('div');
    el.className = 'day';
    var head = document.createElement('div');
    head.className = 'd';
    var left = document.createElement('span'); left.textContent = d;
    var ops = document.createElement('span');
    var c = document.createElement('button');
    c.className = 'mini'; c.type = 'button'; c.textContent = '复制';
    c.onclick = function(){
      copyStr('记一下 ' + d + ' 的事：\n\n' + txt + '\n').then(function(){ toast('已复制，去微信粘贴'); });
    };
    var del = document.createElement('button');
    del.className = 'mini del'; del.type = 'button'; del.textContent = '删';
    del.onclick = function(){ delete store.days[d]; save(); renderList(); };
    ops.appendChild(c); ops.appendChild(del);
    head.appendChild(left); head.appendChild(ops);
    var p = document.createElement('p');
    p.className = 'p';
    p.textContent = txt.slice(0, 90) + (txt.length > 90 ? '…' : '');
    el.appendChild(head); el.appendChild(p);
    host.appendChild(el);
  });
}

document.getElementById('copy').onclick = function(){
  var d = dateEl.value, txt = bodyEl.value;
  if (!txt.trim()){ toast('还没写内容'); return; }
  store.days[d] = txt; save(); renderList();
  copyStr('记一下 ' + d + ' 的事：\n\n' + txt + '\n').then(function(){
    toast('已复制，去微信粘贴发给我');
  }, function(){
    toast('复制失败，请长按手动复制');
  });
};

dateEl.onchange = function(){ bodyEl.value = store.days[dateEl.value] || ''; };

dateEl.value = todayStr();
bodyEl.value = store.days[dateEl.value] || '';
renderList();
</script>
</body>
</html>
