<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今日记录">
<meta name="theme-color" content="#1F1E1C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png">
<title>今日记录</title>
<style>
:root{
  --bg:#F6F5F2; --card:#FFFFFF; --line:#E4E1DB;
  --tx:#1F1E1C; --tx2:#6E6B65; --tx3:#9C9890; --sel:#1F1E1C;
  --okbg:#E1F5EE; --ok:#0F6E56; --warnbg:#FAEEDA; --warn:#854F0B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0; background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  font-size:16px; line-height:1.6;
  padding:0 0 calc(70px + env(safe-area-inset-bottom)) 0;
}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{padding:calc(20px + env(safe-area-inset-top)) 0 12px}
h1{font-size:19px;font-weight:600;margin:0 0 2px}
.sub{font-size:12.5px;color:var(--tx3);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
label.lb{display:block;font-size:13px;color:var(--tx2);margin:0 0 8px;font-weight:500}
input[type=date],input[type=text],input[type=password],textarea,select{
  width:100%;font:inherit;color:var(--tx);background:#FCFCFB;
  border:1px solid var(--line);border-radius:10px;padding:11px;outline:none;
}
textarea{min-height:38vh;resize:vertical;line-height:1.75;background:#FCFCFB}
textarea:focus,input:focus{border-color:#C9C5BD;background:#fff}
.hint{font-size:12px;color:var(--tx3);margin:8px 0 0}
button.act{
  width:100%;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:600;
  background:var(--sel);color:#fff;cursor:pointer;margin-bottom:10px;
}
button.act:active{opacity:.82}
button.act.ghost{background:#fff;color:var(--tx);border:1px solid var(--line);font-weight:500;font-size:15px;padding:13px}
button.mini{border:1px solid var(--line);background:#fff;color:var(--tx);border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer}
button.mini.del{color:#A32D2D;border-color:#F0D5D5}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:none}
.kv span:first-child{color:var(--tx2);flex:none}
.kv span:last-child{text-align:right}
.tagline{font-size:13px;color:var(--tx2);margin:10px 0 4px}
.box{background:#FCFCFB;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:14px;white-space:pre-wrap;word-break:break-word;max-height:46vh;overflow:auto}
.badge{display:inline-block;background:var(--okbg);color:var(--ok);border-radius:6px;padding:2px 8px;font-size:12px;margin-left:6px}
.badge.w{background:var(--warnbg);color:var(--warn)}
nav{
  position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);
  border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom));
  backdrop-filter:saturate(180%) blur(12px);
}
nav button{
  flex:1;border:none;background:none;font:inherit;font-size:12.5px;color:var(--tx3);
  padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
}
nav button.on{color:var(--tx)}
nav .dot{width:16px;height:3px;border-radius:2px;background:transparent}
nav button.on .dot{background:var(--tx)}
.page{display:none}
.page.on{display:block}
.day{border-top:1px solid var(--line);padding:11px 0}
.day:first-child{border-top:none}
.day .d{font-size:13px;color:var(--tx2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.day .p{margin:5px 0 0;font-size:14px;white-space:pre-wrap;word-break:break-word}
.day .m{font-size:12px;color:var(--tx3);margin-top:5px}
.empty{font-size:14px;color:var(--tx3);text-align:center;padding:20px 0}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(84px + env(safe-area-inset-bottom));
  background:var(--sel);color:#fff;padding:11px 17px;border-radius:12px;
  font-size:14px;opacity:0;pointer-events:none;transition:opacity .22s;z-index:9;max-width:86vw;text-align:center;
}
.toast.show{opacity:1}
.row2{display:flex;gap:8px}
.row2>*{flex:1}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>今日记录</h1>
    <p class="sub" id="subline">想到啥写啥，写完点分析</p>
  </header>

  <!-- 今日 -->
  <div class="page on" id="pg-today">
    <div class="card">
      <label class="lb" for="date">日期</label>
      <input type="date" id="date">
    </div>

    <div class="card">
      <label class="lb" for="body">今天做了啥</label>
      <textarea id="body" placeholder="上午跟王总开会，方案被否了&#10;下午重写，改到第三版才过&#10;晚上吃了碗面，回来又改了两个小时&#10;烦死了&#10;&#10;不用整理，不用打标点，错别字也留着"></textarea>
      <p class="hint">用输入法的麦克风直接说，说完不用改。</p>
    </div>

    <button class="act" id="btn-analyze">分析</button>

    <div class="card" id="resultCard" style="display:none">
      <label class="lb">我的分析</label>
      <div id="tags"></div>
      <p class="tagline">主线</p>
      <div class="box" id="mainline"></div>
      <p class="tagline">打算略过</p>
      <div class="box" id="skipped" style="min-height:44px"></div>
      <div class="row2" style="margin-top:12px">
        <button class="mini" id="btn-fix">改标签</button>
        <button class="mini" id="btn-copyAnalysis">复制分析</button>
      </div>
    </div>

    <button class="act" id="btn-write" style="display:none">写文章</button>

    <div class="card" id="articleCard" style="display:none">
      <label class="lb">文章 <span id="artMode"></span></label>
      <div class="box" id="article" style="min-height:180px"></div>
      <div class="row2" style="margin-top:12px">
        <button class="mini" id="btn-copyArticle">复制</button>
        <button class="mini" id="btn-rewrite">重写一版</button>
      </div>
    </div>
  </div>

  <!-- 历史 -->
  <div class="page" id="pg-hist">
    <div class="card">
      <label class="lb">存过的</label>
      <div id="list"></div>
    </div>
    <div class="card">
      <label class="lb">备份</label>
      <p class="hint" style="margin:0 0 10px">数据只存在这台手机上。换手机或清缓存前导出一份。</p>
      <div class="row2">
        <button class="mini" id="btn-export">导出备份</button>
        <button class="mini" id="btn-import">导入备份</button>
      </div>
      <input type="file" id="fileInput" accept=".json,application/json" style="display:none">
    </div>
  </div>

  <!-- 复盘 -->
  <div class="page" id="pg-review">
    <div class="card">
      <label class="lb">复盘</label>
      <div class="row2">
        <button class="mini" id="btn-week">本周</button>
        <button class="mini" id="btn-month">本月</button>
      </div>
      <div style="margin-top:10px">
        <button class="mini" id="btn-polish" style="width:100%">让 AI 把结论写狠一点</button>
      </div>
    </div>
    <div class="card" id="reviewCard" style="display:none">
      <label class="lb">结果</label>
      <div class="box" id="review" style="min-height:200px;max-height:60vh"></div>
      <div style="margin-top:12px"><button class="mini" id="btn-copyReview" style="width:100%">复制</button></div>
    </div>
  </div>

  <!-- 设置 -->
  <div class="page" id="pg-set">
    <div class="card">
      <label class="lb">AI 接口（可选）</label>
      <p class="hint" style="margin:0 0 10px">
        不填也能用：分析和复盘都是本地算的。<br>
        填了之后才能自动写文章。密钥只存在这台手机里，不会上传。
      </p>
      <select id="preset" style="margin-bottom:8px">
        <option value="">选一个服务商…</option>
        <option value="deepseek">DeepSeek（便宜，推荐）</option>
        <option value="siliconflow">硅基流动</option>
        <option value="moonshot">Moonshot / Kimi</option>
        <option value="openai">OpenAI</option>
        <option value="custom">自定义</option>
      </select>
      <input type="text" id="base" placeholder="接口地址 https://api.deepseek.com/v1" style="margin-bottom:8px">
      <input type="text" id="model" placeholder="模型名 deepseek-chat" style="margin-bottom:8px">
      <input type="password" id="key" placeholder="API Key">
      <div style="margin-top:12px"><button class="mini" id="btn-test" style="width:100%">测试连接</button></div>
    </div>

    <div class="card">
      <label class="lb">项目关键词</label>
      <p class="hint" style="margin:0 0 10px">
        我靠关键词判断一件事属于哪个项目。一行一条，格式：<br>
        <code>项目名 = 关键词1, 关键词2</code>
      </p>
      <textarea id="projects" style="min-height:110px"></textarea>
    </div>

    <div class="card">
      <label class="lb">风格档案</label>
      <p class="hint" style="margin:0 0 10px">
        写文章时会一起发给 AI。每次发现"这句不像我"，就把规则加到这里。
      </p>
      <textarea id="style" style="min-height:200px"></textarea>
    </div>

    <div style="margin-bottom:20px"><button class="mini" id="btn-saveSet" style="width:100%">保存设置</button></div>
  </div>
</div>

<nav>
  <button class="on" data-p="today">今日<span class="dot"></span></button>
  <button data-p="hist">历史<span class="dot"></span></button>
  <button data-p="review">复盘<span class="dot"></span></button>
  <button data-p="set">设置<span class="dot"></span></button>
</nav>

<div class="toast" id="toast"></div>

<script>
var KEY='wxlog.v3';
var DEF_STYLE=[
'句子偏短，能断就断',
'允许句子不完整，允许"其实/反正/说白了/老实讲"这类口语插入',
'段落长短不齐，允许单句成段',
'具体数字、时间、人名地名一律保留',
'不升华，不总结金句，不写"通过这件事我明白了"',
'承认没做好、烦躁、走弯路，不粉饰',
'先写事实，判断后置，能不写判断就不写',
'标题像说话，不用"如何…""关于…的思考"'
].join('\n');

var store=JSON.parse(localStorage.getItem(KEY)||'{}');
if(!store.days)store.days={};
if(!store.cfg)store.cfg={base:'',model:'',key:''};
if(!store.projects)store.projects='';
if(store.style===undefined)store.style=DEF_STYLE;
function save(){localStorage.setItem(KEY,JSON.stringify(store));}

var TYPE_MAP=[
  ['开会',/开会|会议|例会|对齐|碰一下|评审|过会|站会/],
  ['写方案',/方案|ppt|PPT|文档|改稿|初稿|提案|写稿|汇报材料/],
  ['见客户',/客户|拜访|甲方|签约|面谈|对接/],
  ['执行',/上线|发布|提交|处理|跟进|配置|部署|改完|做完了|搞定/],
  ['学习',/看|学|读|课程|研究|调研|查资料|翻了/],
  ['被打断',/打断|临时|插进来|救火|又来|叫过去/],
  ['休息',/休息|摸鱼|吃饭|睡觉|散步|下班|回家/]
];
var NEG=/烦|烦死|累|崩|头疼|恶心|郁闷|气|糟|没劲|受不了|无语|摆烂/;
var POS=/顺|搞定|不错|成了|过了|开心|还行|满意|搞定/;
var TURN=/但是|结果|没想到|被否|推翻|改了|重新|又|反而|卡住|没过|白做/;
var HOUR_RE=/(\d+(?:\.\d+)?)\s*(个)?\s*小时|(\d+(?:\.\d+)?)\s*h/i;

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}
function copyStr(s){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(s);
  return new Promise(function(res,rej){
    var ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');document.body.removeChild(ta);ok?res():rej();
  });
}
function todayStr(){var d=new Date(),m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0'+m:m)+'-'+(dd<10?'0'+dd:dd);}

function sentences(t){
  return t.split(/[\n。！？!?；;]+/).map(function(s){return s.trim();}).filter(function(s){return s.length>1;});
}

function analyze(text){
  var ss=sentences(text);
  var types=[],hours=null,status='进行中',mood='平',proj='推断不出';

  ss.forEach(function(s){
    TYPE_MAP.forEach(function(p){if(p[1].test(s)&&types.indexOf(p[0])<0)types.push(p[0]);});
  });
  if(!types.length)types.push('推断不出');

  var m=text.match(HOUR_RE);
  if(m){
    hours=(m[1]||m[3])+'h';
  }else{
    var seg=/上午|下午|晚上|一整天|整天|半天/.test(text);
    if(seg){
      var n=0;['上午','下午','晚上'].forEach(function(w){if(text.indexOf(w)>=0)n++;});
      if(/一整天|整天/.test(text))hours='7h（估）';
      else if(n>=2)hours='5h（估）';
      else if(n===1)hours='3h（估）';
    }
  }
  if(!hours)hours='推断不出';

  if(/完成|做完|搞定|过了|交了|上线|发布|写完|改完|结束/.test(text))status='完成';
  else if(/卡|没搞定|被否|阻塞|等着|推不动|做不下去|没过|白做/.test(text))status='卡住';

  if(/崩|崩溃|烦死|受不了|摆烂|无语/.test(text))mood='崩';
  else if(NEG.test(text))mood='烦';
  else if(POS.test(text))mood='顺';

  var pmap={};
  store.projects.split('\n').forEach(function(line){
    var mm=line.match(/^\s*(.+?)\s*[=＝:：]\s*(.+)$/);
    if(mm)pmap[mm[1].trim()]=mm[2].split(/[,，、]/).map(function(x){return x.trim();}).filter(Boolean);
  });
  for(var name in pmap){
    if(pmap[name].some(function(k){return k&&text.indexOf(k)>=0;})){proj=name;break;}
  }

  var best='',bestScore=-1,bestIdx=0;
  ss.forEach(function(s,i){
    var sc=0;
    if(TURN.test(s))sc+=3;
    if(NEG.test(s))sc+=2;
    if(/\d/.test(s))sc+=1;
    sc+=Math.min(s.length/40,2);
    if(text.indexOf(s)===0)sc+=0.5;
    if(sc>bestScore){bestScore=sc;best=s;bestIdx=i;}
  });
  var skipped=ss.filter(function(_,i){return i!==bestIdx;});

  return {proj:proj,types:types,hours:hours,status:status,mood:mood,main:best||text.slice(0,60),skipped:skipped};
}

function renderResult(r){
  var h='';
  [['项目',r.proj],['类型',r.types.join('、')],['耗时',r.hours],['状态',r.status],['情绪',r.mood]].forEach(function(p){
    var val=p[1];var b='';
    if(String(val).indexOf('估')>=0)b='<span class="badge w">估</span>';
    if(val==='推断不出')b='<span class="badge w">缺信息</span>';
    h+='<div class="kv"><span>'+p[0]+'</span><span>'+val+b+'</span></div>';
  });
  document.getElementById('tags').innerHTML=h;
  document.getElementById('mainline').textContent=r.main;
  document.getElementById('skipped').textContent=r.skipped.length?r.skipped.join('\n'):'（没有别的了）';
  document.getElementById('resultCard').style.display='';
  document.getElementById('btn-write').style.display='';
}

var SYS_ARTICLE=[
'你在替用户写公众号文章。用户给的是他自己的口语流水账，你要写成像他本人写的文章，不能像 AI。',
'',
'硬规则：',
'1. 禁用词：首先、其次、再次、总之、综上所述、总而言之、值得注意的是、值得一提、在当今、随着……的发展、众所周知、赋能、闭环、抓手、打法、颗粒度、心智、底层逻辑、组合拳、让我们、我们一起、希望对你有帮助、不妨、由此可见、不难看出、至关重要、不可或缺、不仅仅是……更是……、不是……而是……',
'2. 禁用结构：三段式排比；每段首句都是总结句；结尾升华金句；"通过这件事我明白了""这件事让我深刻认识到"这类总结；用小标题把文章均匀切成几块；开头宏大背景铺垫',
'3. 禁用排版：标题堆 emoji；破折号成瘾；全文加粗超过 3 处；每条都编号像说明书',
'4. 保留具体数字、具体时间、具体人名地名代号',
'5. 允许句子不完整，允许"其实/反正/说白了/老实讲/结果/倒是"这类口语插入',
'6. 段落长短不齐，允许单句成段',
'7. 标题像说话，不用"如何……""关于……的思考""浅析……""……的 N 个方法"',
'8. 承认没做好、烦躁、犹豫、走弯路，不要粉饰',
'9. 先写事实，判断后置，能不写判断就不写。写完自己读一遍，哪句"顺得不像人话"就改掉',
'',
'用户风格档案：',
'---',
'{STYLE}',
'---'
].join('\n');

async function chat(system,user){
  var c=store.cfg;
  if(!c.base||!c.key)throw new Error('还没填 AI 接口，去设置页填一下');
  var url=c.base.replace(/\/+$/,'')+'/chat/completions';
  var r=await fetch(url,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key},
    body:JSON.stringify({model:c.model||'deepseek-chat',temperature:0.85,
      messages:[{role:'system',content:system},{role:'user',content:user}]})
  });
  if(!r.ok){
    var t=await r.text();
    throw new Error('HTTP '+r.status+' '+t.slice(0,160));
  }
  var j=await r.json();
  if(!j.choices||!j.choices[0])throw new Error('返回格式不对：'+JSON.stringify(j).slice(0,160));
  return j.choices[0].message.content.trim();
}

function buildReview(range){
  var now=new Date();
  var start;
  if(range==='week'){
    var d=new Date(now);var wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);
    start=d.toISOString().slice(0,10);
  }else{
    start=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-01';
  }
  var ds=Object.keys(store.days).filter(function(d){return d>=start&&d<=todayStr();}).sort();
  if(!ds.length)return '这段时间还没有记录。';

  var typeCount={},hoursExact=0,hoursEst=0,projCount={},stuck=[],done=[],moodCount={};
  ds.forEach(function(d){
    var rec=store.days[d];
    var a=rec.a||analyze(rec.text);
    a.types.forEach(function(t){typeCount[t]=(typeCount[t]||0)+1;});
    var hm=String(a.hours).match(/([\d.]+)/);
    if(hm){
      if(String(a.hours).indexOf('估')>=0)hoursEst+=parseFloat(hm[1]);else hoursExact+=parseFloat(hm[1]);
    }
    if(a.proj&&a.proj!=='推断不出')projCount[a.proj]=(projCount[a.proj]||0)+1;
    moodCount[a.mood]=(moodCount[a.mood]||0)+1;
    if(a.status==='卡住')stuck.push(d+'：'+a.main);
    if(a.status==='完成')done.push(d+'：'+a.main);
  });

  var L=[];
  L.push('# '+(range==='week'?'本周':'本月')+'复盘（'+start+' 至 '+todayStr()+'）');
  L.push('');
  L.push('记录天数：'+ds.length+' 天');
  L.push('');
  L.push('## 类型分布');
  Object.keys(typeCount).sort(function(a,b){return typeCount[b]-typeCount[a];}).forEach(function(t){
    L.push('- '+t+'：'+typeCount[t]+' 次');
  });
  L.push('');
  L.push('## 耗时');
  L.push('- 明确记录的：'+hoursExact+' 小时');
  L.push('- 按语境估的：'+hoursEst+' 小时（估）');
  if(!hoursExact&&!hoursEst)L.push('- 记录不足，无法统计');
  L.push('');
  L.push('## 项目');
  if(Object.keys(projCount).length){
    Object.keys(projCount).sort(function(a,b){return projCount[b]-projCount[a];}).forEach(function(p){
      L.push('- '+p+'：'+projCount[p]+' 天');
    });
  }else{L.push('- 没匹配到项目（设置页加关键词）');}
  L.push('');
  L.push('## 完成的');
  L.push(done.length?done.map(function(x){return '- '+x;}).join('\n'):'- 无');
  L.push('');
  L.push('## 卡住的');
  L.push(stuck.length?stuck.map(function(x){return '- '+x;}).join('\n'):'- 无');
  L.push('');
  L.push('## 情绪');
  Object.keys(moodCount).sort(function(a,b){return moodCount[b]-moodCount[a];}).forEach(function(m){
    L.push('- '+m+'：'+moodCount[m]+' 天');
  });
  return L.join('\n');
}

var SYS_POLISH=[
'你是一个很直接的个人管理顾问。下面是用户一段时间的原始统计，你要把它改写成一份有判断、有取舍动作的复盘。',
'',
'要求：',
'1. 所有数字必须来自统计，没数据的写"记录不足，无法统计"，绝对不许编',
'2. 判断下重手：某件事反复卡住就直接写"这件事该砍了"，不要写"建议持续关注"',
'3. 不写"继续加油""保持节奏"这类空话',
'4. 结尾给三条动作：砍掉一件事、加上一件事、一件必须收尾的事',
'5. 语气像跟自己说话，不用汇报体，不用 markdown 标题堆砌',
'6. 500 字以内'
].join('\n');

var cur=null,curDate=null;

document.querySelectorAll('nav button').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('nav button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on');
    document.querySelectorAll('.page').forEach(function(p){p.classList.remove('on');});
    document.getElementById('pg-'+b.dataset.p).classList.add('on');
    if(b.dataset.p==='hist')renderList();
  };
});

var dateEl=document.getElementById('date'),bodyEl=document.getElementById('body');

document.getElementById('btn-analyze').onclick=function(){
  var t=bodyEl.value.trim();
  if(!t){toast('还没写内容');return;}
  curDate=dateEl.value;cur=analyze(t);
  store.days[curDate]={text:t,a:cur};save();
  renderResult(cur);
  document.getElementById('articleCard').style.display='none';
  toast('分析完了，看看对不对');
};

document.getElementById('btn-fix').onclick=function(){
  if(!cur)return;
  var p=prompt('项目名（改完回车）',cur.proj==='推断不出'?'':cur.proj);
  if(p===null)return;
  cur.proj=p.trim()||'推断不出';
  store.days[curDate].a=cur;save();renderResult(cur);
};

document.getElementById('btn-copyAnalysis').onclick=function(){
  if(!cur)return;
  var s='['+curDate+'] '+cur.main+'\n项目：'+cur.proj+'\n类型：'+cur.types.join('、')+
    '\n耗时：'+cur.hours+'\n状态：'+cur.status+'\n情绪：'+cur.mood;
  copyStr(s).then(function(){toast('已复制');},function(){toast('复制失败');});
};

document.getElementById('btn-write').onclick=async function(){
  if(!cur)return;
  var card=document.getElementById('articleCard');
  card.style.display='';
  var box=document.getElementById('article');
  box.textContent='正在写…';
  document.getElementById('artMode').textContent='';
  try{
    var sys=SYS_ARTICLE.replace('{STYLE}',store.style||DEF_STYLE);
    var user='日期：'+curDate+'\n今天的事：\n'+bodyEl.value+'\n\n主线：'+cur.main+
      '\n\n请写成一篇公众号文章，直接给标题和正文。';
    var out=await chat(sys,user);
    box.textContent=out;
    document.getElementById('artMode').innerHTML='<span class="badge">AI</span>';
    store.days[curDate].article=out;save();
  }catch(e){
    box.textContent='写不出来：'+e.message+'\n\n去设置页检查接口，或者不填接口也能用——分析和复盘都是本地算的。';
    document.getElementById('artMode').innerHTML='<span class="badge w">未配置</span>';
  }
};

document.getElementById('btn-rewrite').onclick=function(){document.getElementById('btn-write').click();};
document.getElementById('btn-copyArticle').onclick=function(){
  var t=document.getElementById('article').textContent;
  if(!t||t==='正在写…')return;
  copyStr(t).then(function(){toast('已复制');},function(){toast('复制失败');});
};

function renderList(){
  var host=document.getElementById('list');host.innerHTML='';
  var ds=Object.keys(store.days).sort().reverse();
  if(!ds.length){host.innerHTML='<div class="empty">还没存过</div>';return;}
  ds.slice(0,40).forEach(function(d){
    var r=store.days[d];var a=r.a||analyze(r.text);
    var el=document.createElement('div');el.className='day';
    var head=document.createElement('div');head.className='d';
    var left=document.createElement('span');left.textContent=d;
    var ops=document.createElement('span');
    var o=document.createElement('button');o.className='mini';o.textContent='打开';
    o.onclick=function(){
      document.querySelector('nav button[data-p="today"]').click();
      dateEl.value=d;bodyEl.value=r.text;cur=a;curDate=d;renderResult(a);
      document.getElementById('articleCard').style.display=r.article?'':'none';
      if(r.article)document.getElementById('article').textContent=r.article;
    };
    var del=document.createElement('button');del.className='mini del';del.textContent='删';
    del.onclick=function(){delete store.days[d];save();renderList();};
    ops.appendChild(o);ops.appendChild(del);
    head.appendChild(left);head.appendChild(ops);
    var p=document.createElement('p');p.className='p';
    p.textContent=r.text.slice(0,80)+(r.text.length>80?'…':'');
    var m=document.createElement('div');m.className='m';
    m.textContent=[a.proj,a.types.join('、'),a.hours,a.status,a.mood].filter(Boolean).join(' · ');
    el.appendChild(head);el.appendChild(p);el.appendChild(m);
    host.appendChild(el);
  });
}

function showReview(range){
  var t=buildReview(range);
  document.getElementById('reviewCard').style.display='';
  document.getElementById('review').textContent=t;
  window.__reviewRange=range;window.__reviewRaw=t;
}
document.getElementById('btn-week').onclick=function(){showReview('week');};
document.getElementById('btn-month').onclick=function(){showReview('month');};
document.getElementById('btn-copyReview').onclick=function(){
  copyStr(document.getElementById('review').textContent).then(function(){toast('已复制');},function(){toast('复制失败');});
};
document.getElementById('btn-polish').onclick=async function(){
  var raw=window.__reviewRaw;
  if(!raw){toast('先点本周或本月');return;}
  var box=document.getElementById('review');box.textContent='正在改…';
  try{
    var out=await chat(SYS_POLISH,'原始统计：\n'+raw);
    box.textContent=out;
  }catch(e){
    box.textContent=raw+'\n\n（AI 润色没跑起来：'+e.message+'）';
  }
};

var PRESETS={
  deepseek:{base:'https://api.deepseek.com/v1',model:'deepseek-chat'},
  siliconflow:{base:'https://api.siliconflow.cn/v1',model:'Qwen/Qwen2.5-72B-Instruct'},
  moonshot:{base:'https://api.moonshot.cn/v1',model:'moonshot-v1-8k'},
  openai:{base:'https://api.openai.com/v1',model:'gpt-4o-mini'}
};
document.getElementById('preset').onchange=function(){
  var v=this.value;
  if(v==='custom'){document.getElementById('base').value='';document.getElementById('model').value='';return;}
  var p=PRESETS[v];if(p){document.getElementById('base').value=p.base;document.getElementById('model').value=p.model;}
};

document.getElementById('btn-saveSet').onclick=function(){
  store.cfg={
    base:document.getElementById('base').value.trim(),
    model:document.getElementById('model').value.trim(),
    key:document.getElementById('key').value.trim()
  };
  store.projects=document.getElementById('projects').value;
  store.style=document.getElementById('style').value;
  save();toast('已保存');
};

document.getElementById('btn-test').onclick=async function(){
  var c={
    base:document.getElementById('base').value.trim(),
    model:document.getElementById('model').value.trim(),
    key:document.getElementById('key').value.trim()
  };
  if(!c.base||!c.key){toast('地址和密钥都要填');return;}
  var old=store.cfg;store.cfg=c;
  try{
    var r=await chat('你只回复两个字：正常','测试');
    toast('连上了：'+r.slice(0,20));
  }catch(e){toast('失败：'+e.message.slice(0,60));}
  finally{store.cfg=old;}
};

document.getElementById('btn-export').onclick=function(){
  var blob=new Blob([JSON.stringify(store,null,1)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='jilu-backup-'+todayStr()+'.json';a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1500);
};
var fi=document.getElementById('fileInput');
document.getElementById('btn-import').onclick=function(){fi.click();};
fi.onchange=function(){
  var f=fi.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(!o.days)throw new Error('格式不对');
      store=o;save();
      document.getElementById('projects').value=store.projects||'';
      document.getElementById('style').value=store.style||DEF_STYLE;
      document.getElementById('base').value=(store.cfg||{}).base||'';
      document.getElementById('model').value=(store.cfg||{}).model||'';
      document.getElementById('key').value=(store.cfg||{}).key||'';
      renderList();toast('导入成功');
    }catch(e){toast('导入失败：'+e.message);}
  };
  r.readAsText(f);
};

document.getElementById('projects').value=store.projects||'';
document.getElementById('style').value=store.style||DEF_STYLE;
document.getElementById('base').value=store.cfg.base||'';
document.getElementById('model').value=store.cfg.model||'';
document.getElementById('key').value=store.cfg.key||'';
dateEl.value=todayStr();
if(store.days[dateEl.value]){bodyEl.value=store.days[dateEl.value].text;}
renderList();
</script>
